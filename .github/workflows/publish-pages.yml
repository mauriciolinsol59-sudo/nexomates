name: Publicar la interfaz de Nexo en GitHub Pages

on:
  push:
    branches: [main]
    paths-ignore:
      - 'index.html'
      - 'activities.html'
      - 'explore.html'
      - '_sitemap.html'
      - '+not-found.html'
      - 'favicon.ico'
      - '_expo/**'
      - 'assets/node_modules/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm build:web
        env:
          EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID: ${{ vars.EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID }}
      - name: Actualizar la carpeta publicada por GitHub Pages
        run: |
          cp -R dist/. .
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f index.html activities.html explore.html _sitemap.html '+not-found.html' favicon.ico _expo assets/node_modules
          if git diff --cached --quiet; then
            echo 'La versión publicada ya está actualizada.'
            exit 0
          fi
          git commit -m 'Build Nexo web app for GitHub Pages'
          git push origin HEAD:main
